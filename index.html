<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>API POST Test</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 18px;
      padding: 10px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
    }

    #status {
      margin-top: 30px;
      font-weight: bold;
    }

    pre {
      background: #f4f4f4;
      padding: 15px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>API POST Test</h1>

  <label for="name">名前</label>
  <input id="name" type="text" placeholder="Taro">

  <label for="message">メッセージ</label>
  <textarea id="message" rows="4" placeholder="Hello API!"></textarea>

  <button onclick="sendPost()">POST送信</button>

  <div id="status">Status: 未送信</div>

  <h2>送信JSON</h2>
  <pre id="request">---</pre>

  <h2>Response</h2>
  <pre id="response">---</pre>

  <script>
    async function sendPost() {

      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      const data = {
        name: name,
        message: message
      };

      document.getElementById("request").textContent =
        JSON.stringify(data, null, 2);

      document.getElementById("status").textContent =
        "Status: 送信中...";

      document.getElementById("response").textContent =
        "Waiting...";

      try {

        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify(data)
          }
        );

        const result = await response.json();

        document.getElementById("status").textContent =
          "Status: " + response.status;

        document.getElementById("response").textContent =
          JSON.stringify(result, null, 2);

      } catch (error) {

        document.getElementById("status").textContent =
          "Status: ERROR";

        document.getElementById("response").textContent =
          error.message;
      }
    }
  </script>

</body>
</html>
